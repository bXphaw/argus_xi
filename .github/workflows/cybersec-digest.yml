# Save as .github/workflows/cybersec-digest.yml

name: cybersec-digest

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write           # needed to commit sent_articles.json back

concurrency:
  group: cybersec-digest
  cancel-in-progress: false # queue overlapping runs instead of racing on git state

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # safety net now that 60+ feeds get polled every run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"       # caches wheels -> faster runs -> fewer Actions minutes

      - run: pip install -r requirements.txt

      - run: python cybersec_digest.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}

      - name: Commit updated state
        run: |
          git config user.name "cybersec-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sent_articles.json pending_digest.json
          git diff --staged --quiet || git commit -m "Update sent_articles.json"
          git push
